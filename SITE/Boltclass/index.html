<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BOLT Class School — Gestão Escolar</title><style>
:root{--ink:#17213a;--muted:#73809a;--bg:#f3f6fb;--line:#e3e8f2;--blue:#475569;--nav:#111a32;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{display:flex;min-height:100vh}.sidebar{background:var(--nav);color:#d9e0f6;width:254px;padding:26px 16px;flex-shrink:0}.brand{font-size:28px;font-weight:850;letter-spacing:-1.3px;color:#fff;margin:0 12px 4px}.brand span{color:#9d94ff}.subbrand{margin:0 12px 28px;color:#9ba8cc;font-size:11px;letter-spacing:2px;font-weight:750}.nav{display:block;width:100%;border:0;background:transparent;color:#b8c3df;padding:12px 14px;text-align:left;border-radius:12px;margin:4px 0;font-weight:650}.nav.active,.nav:hover{background:#303c61;color:white}.sidebarfoot{border-top:1px solid #35415e;padding:20px 12px;margin-top:26px;font-size:12px;color:#aab6d4}.main{flex:1;min-width:0;padding:28px clamp(16px,3vw,44px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}.eyebrow{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1.8px;text-transform:uppercase}h1{font-size:27px;letter-spacing:-.8px;margin:3px 0}h2{font-size:19px;margin:0 0 14px}h3{font-size:15px;margin:0 0 10px}p{margin:5px 0 12px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 5px 20px #23345c08;margin-bottom:16px}.metric{font-size:28px;font-weight:850;margin:8px 0}.btn{background:var(--blue);border:1px solid var(--blue);border-radius:11px;color:white;padding:11px 16px;font-weight:750}.btn.alt{background:#fff;color:#47536d;border-color:#dce2ee}.btn.danger{background:#fff1f1;border-color:#ffd7d7;color:#bb3535}.btn.small{padding:7px 10px;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.field{display:flex;flex-direction:column;gap:6px;margin:0 0 15px;font-size:12px;font-weight:750;color:#47536c}.field input,.field select,.field textarea{width:100%;border:1px solid #dbe2ed;background:white;color:#17213a;border-radius:10px;padding:11px 12px;outline:none}.field textarea{min-height:78px}.field input:focus,.field select:focus{border-color:#786afa;box-shadow:0 0 0 3px #786afa19}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#8190a7;background:#f8faff}td,th{padding:12px 10px;border-bottom:1px solid #edf0f6;white-space:nowrap}td{font-size:13px}.pill{display:inline-block;padding:4px 9px;border-radius:100px;background:#ecf9f1;color:#1a8d58;font-size:11px;font-weight:800}.pill.off{background:#fff0e9;color:#b86b21}.schoolcard{display:flex;gap:15px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.avatar{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-size:22px;color:white;flex-shrink:0;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:contain}.schoolinfo{flex:1;min-width:0}.schoolinfo strong{font-size:15px}.schoolinfo p{margin:4px 0 0;color:var(--muted);font-size:12px}.wizard{max-width:900px}.steps{display:flex;gap:6px;margin:16px 0 24px}.step{flex:1;height:6px;border-radius:20px;background:#e7eaf4}.step.on{background:#6758ed}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.option{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;gap:10px;align-items:center}.preview{padding:25px;border-radius:18px;background:#f7f9fd;border:1px solid var(--line)}.preview-head{border-radius:12px;padding:16px;color:white;font-weight:800;display:flex;align-items:center;gap:10px}.preview-head img{width:45px;height:45px;object-fit:contain}.notice{background:#fff8e7;border:1px solid #f5e5bb;color:#86621c;padding:12px;border-radius:11px;font-size:12px;margin:12px 0}.empty{padding:30px;text-align:center;color:var(--muted)}.schoolbar{display:flex;align-items:center;gap:12px}.schoolbar .avatar{width:38px;height:38px}.mobilemenu{display:none}.schoolnav{background:#eaeef9;padding:10px;border-radius:12px;margin-bottom:16px}.schoolnav .btn{margin:3px}.hide{display:none!important}.stat{font-size:12px;color:var(--muted)}.logo-upload{max-width:100%;height:75px;object-fit:contain}.footer{font-size:11px;color:#8c97aa;margin:25px 0}.tag{font-size:10px;padding:3px 7px;background:#f0edff;border-radius:6px;color:#5c4ed5;font-weight:800}.inline{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.inline>.field{flex:1;min-width:160px}.banner{padding:22px;border-radius:16px;background:linear-gradient(115deg,#201c52,#5b53c7);color:white;margin-bottom:16px}.banner h2{font-size:23px}.banner p{color:#d5d4fa}.banner .btn{background:white;color:#4e44b8;border-color:white}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.app{display:block}.sidebar{width:100%;padding:12px;position:relative}.brand{display:inline-block;font-size:23px;margin:0 8px}.subbrand{display:inline;font-size:10px}.navitems{display:flex;overflow:auto;gap:5px;margin-top:10px}.nav{white-space:nowrap;width:auto;padding:9px 12px}.sidebarfoot{display:none}.main{padding:18px 13px}.top{align-items:flex-start}.top h1{font-size:23px}.two,.options{grid-template-columns:1fr}.schoolcard{align-items:flex-start;flex-wrap:wrap}.schoolcard .actions{width:100%}.card{padding:16px}.grid{gap:9px}.metric{font-size:23px}}@media(max-width:400px){.grid{grid-template-columns:1fr 1fr}.top{flex-wrap:wrap}}

.student-hero{display:flex;gap:16px;align-items:center;padding:18px;border-radius:16px;background:linear-gradient(110deg,#eef0ff,#f7fbff);margin-bottom:16px}.student-avatar{width:66px;height:66px;flex:none;border-radius:19px;background:#ddd9ff;color:#5144b9;display:grid;place-items:center;font-size:30px;font-weight:800;overflow:hidden}.student-avatar img{width:100%;height:100%;object-fit:cover}.student-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.student-tabs span{padding:7px 11px;border-radius:9px;background:#f0f2fa;color:#4a5570;font-size:12px;font-weight:700}.form-section{border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;background:#fff}.form-section h3{margin:0 0 6px}.form-section p{margin:0 0 16px;color:var(--muted);font-size:12px}.student-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.student-grid .field{min-width:0}.student-card{display:flex;align-items:center;gap:12px}.student-card .student-avatar{width:42px;height:42px;border-radius:12px;font-size:17px}.student-table td{vertical-align:middle}.student-table small{display:block;color:var(--muted)}.demo-label{display:inline-block;padding:5px 9px;border-radius:8px;background:#ecfdf3;color:#176943;font-weight:700;font-size:11px}@media(max-width:800px){.student-grid{grid-template-columns:1fr 1fr}}@media(max-width:540px){.student-grid{grid-template-columns:1fr}.form-section{padding:12px}}
</style></head><body><div id="root"></div><script src="../bolt-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="../bolt-workspace.js"></script><script src="family-admin.js"></script><script>
(async function(){'use strict';
const workspace=await window.BOLT_WORKSPACE.open('class'),context=workspace.bundle;
const KEY='bolt_class_school_offline_v1_data';const MODULES=[['students','Alunos e matrículas'],['staff','Professores e equipe'],['classes','Turmas e disciplinas'],['attendance','Diário de classe'],['grades','Notas e boletins'],['finance','Financeiro escolar'],['family','Portal da Família'],['messages','Comunicados'],['calendar','Calendário escolar'],['reports','Relatórios']];const DEFAULT_MODULES=MODULES.map(x=>x[0]);const blank=()=>({version:2,schools:[],plans:[{id:'start',name:'Start',price:99,limit:100},{id:'pro',name:'Pro',price:199,limit:400},{id:'premium',name:'Premium',price:349,limit:1500}],logs:[]});let db=context.data||blank();
let mode='company',page='dashboard',sid=null,step=0,editing=null,form={},filter='',classId='',period='1º Bimestre';const $=()=>document.getElementById('root');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=> 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);const save=()=>workspace.save(db);const school=()=>db.schools.find(s=>s.id===sid);const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const date=()=>new Date().toISOString().slice(0,10);const log=t=>{db.logs.unshift({id:uid(),at:new Date().toLocaleString('pt-BR'),text:t});db.logs=db.logs.slice(0,150)};const mod=(s,k)=>s.modules.includes(k)&&(!context.entitlements||['support','settings','audit'].includes(k)||context.entitlements.includes(k));const btn=(t,act,cls='')=>`<button type="button" class="btn ${cls}" data-action="${act}">${t}</button>`;const field=(name,label,value='',type='text',required=false)=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`;const select=(name,label,opts,value='')=>`<label class="field">${label}<select name="${name}">${opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;let layout=(title,body,tools='')=>{let s=school(),isSchool=mode==='school';let nav=isSchool?[['overview','Visão geral'],['students','Alunos'],['staff','Equipe'],['classes','Turmas'],['attendance','Diário'],['grades','Notas'],['finance','Financeiro'],['family','Família'],['messages','Comunicados'],['calendar','Calendário'],['reports','Relatórios'],['settings','Configurações']].filter(x=>['overview','settings'].includes(x[0])||mod(s,x[0])):[['dashboard','Visão geral'],['schools','Escolas clientes'],['create','Criar escola'],['plans','Planos'],['activity','Atividades'],['backup','Backup local']];$('root');document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand class-brand-plate">${s.logo?`<img src="${esc(s.logo)}" alt="Logo de ${esc(s.name)}">`:`<span class="school-brand-initial">${esc(s.name.charAt(0))}</span>`}<strong>${esc(s.name)}</strong></div><div class="subbrand">${isSchool?'SCHOOL':'COMPANY'} • ONLINE</div><div class="navitems">${nav.map(x=>`<button class="nav ${page===x[0]?'active':''}" data-nav="${x[0]}">${esc(x[1])}</button>`).join('')}</div><div class="sidebarfoot">${isSchool?`Ambiente: ${esc(s.name)}<p>${btn('← Voltar à Company','company','alt small')}</p>`:'Construtor de escolas • Testes locais'}</div></aside><main class="main"><div class="top"><div><div class="eyebrow">${isSchool?esc(s.name):'Central de administração'}</div><h1>${esc(title)}</h1></div><div class="actions">${tools}</div></div>${body}<div class="footer">BOLT Class • Ambiente administrativo online</div></main></div>`};
function render(){try{if(mode==='school'&&!school()){mode='company';page='schools'}if(mode!=='school')throw Error('A administração comercial pertence ao Master.');renderSchool()}catch(e){console.error(e);document.getElementById('root').innerHTML=`<div class="card" style="margin:30px"><h2>Não foi possível abrir esta tela</h2><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Recarregar</button></div>`}}
function renderCompany(){if(page==='dashboard'){let active=db.schools.filter(s=>s.status==='active');layout('Visão geral',`<div class="banner"><h2>Seu negócio. Todas as escolas. Um só painel.</h2><p>Crie e personalize ambientes escolares sem copiar arquivos ou publicar um site por cliente.</p>${btn('＋ Criar sistema escolar','new')}</div><div class="grid">${[['Escolas cadastradas',db.schools.length],['Escolas ativas',active.length],['Mensalidade prevista',money(active.reduce((a,s)=>a+Number(s.price||0),0))],['Alunos cadastrados',db.schools.reduce((a,s)=>a+s.students.length,0)]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="card"><h2>Últimas escolas</h2>${schoolCards(db.schools.slice(-5).reverse())}</div>`);return}if(page==='schools'){layout('Escolas clientes',`<div class="card"><div class="inline">${field('search','Buscar instituição',filter)}${btn('＋ Nova escola','new')}</div>${schoolCards(db.schools.filter(s=>s.name.toLowerCase().includes(filter.toLowerCase())))}</div>`,btn('Criar escola','new'));return}if(page==='create'){renderWizard();return}if(page==='plans'){layout('Planos comerciais',`<div class="grid">${db.plans.map(p=>`<div class="card"><div class="eyebrow">${esc(p.name)}</div><div class="metric">${money(p.price)}<small style="font-size:12px"> /mês</small></div><p class="muted">Até ${p.limit} alunos</p>${btn('Editar plano','editplan:'+p.id,'alt small')}</div>`).join('')}</div><div class="notice">Planos são referências comerciais locais. A cobrança automática ainda não existe.</div>`);return}if(page==='activity'){layout('Histórico de atividades',`<div class="card">${db.logs.length?db.logs.map(x=>`<p><strong>${esc(x.at)}</strong> — ${esc(x.text)}</p>`).join(''):'Nenhuma atividade registrada.'}</div>`);return}if(page==='backup'){layout('Backup e restauração',`<div class="card"><h2>Seus dados de teste</h2><p>Exporte todos os cadastros e configurações para um arquivo JSON. O arquivo poderá ser importado neste navegador ou em outro computador.</p><div class="actions">${btn('Exportar backup JSON','export')}${btn('Importar backup JSON','import','alt')}${btn('Apagar todos os dados locais','wipe','danger')}</div><input type="file" id="importfile" accept=".json,application/json" class="hide"></div><div class="notice">O navegador pode apagar dados locais. Exporte backups regularmente. Esta versão não substitui um banco de dados seguro.</div>`);return}}
function schoolCards(items){if(!items.length)return '<div class="empty">Nenhuma escola cadastrada. Crie a primeira no painel comercial.</div>';return items.map(s=>`<div class="schoolcard"><div class="avatar" style="background:${esc(s.color)}">${s.logo?`<img src="${s.logo}" alt="Logo">`:'🏫'}</div><div class="schoolinfo"><strong>${esc(s.name)}</strong> <span class="pill ${s.status==='active'?'':'off'}">${s.status==='active'?'Ativa':'Suspensa'}</span><p>${esc(s.city||'Cidade não informada')} • ${esc(s.planName)} • ${money(s.price)}/mês • ${s.students.length} alunos</p></div><div class="actions">${btn('Abrir sistema','open:'+s.id,'small')}${btn('Personalizar','edit:'+s.id,'alt small')}${btn(s.status==='active'?'Suspender':'Ativar','toggle:'+s.id,'alt small')}</div></div>`).join('')}
function renderWizard(){let s=editing?db.schools.find(x=>x.id===editing):null;if(!Object.keys(form).length)form=s?{...s,modules:[...s.modules]}:{name:'',city:'',cnpj:'',email:'',phone:'',slug:'',plan:'pro',price:199,color:'#6255eb',logo:'',modules:[...DEFAULT_MODULES],adminName:'',adminEmail:'',status:'active'};let parts=[`<h2>Dados da instituição</h2><div class="two">${field('name','Nome da escola',form.name,'text',true)}${field('city','Cidade / UF',form.city)}${field('cnpj','CNPJ (opcional)',form.cnpj)}${field('phone','Telefone',form.phone)}${field('email','E-mail institucional',form.email,'email')}${field('slug','Identificador / endereço amigável',form.slug)}</div>`,`<h2>Plano e contratação</h2>${select('plan','Plano',db.plans.map(p=>[p.id,p.name+' — '+money(p.price)]).concat([['custom','Personalizado']]),form.plan)}${field('price','Mensalidade contratada (R$)',form.price,'number')}<p class="muted">O valor e os limites são comerciais. A validação dos módulos e limites será feita na versão conectada.</p>`,`<h2>Identidade visual</h2><div class="two">${field('color','Cor principal (hexadecimal)',form.color)}<label class="field">Enviar logo da escola (PNG/JPG, até 300 KB)<input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp"></label></div><div class="preview"><div class="preview-head" style="background:${safeColor(form.color)}">${form.logo?`<img src="${form.logo}" alt="Logo">`:'🏫'} <span>${esc(form.name||'Nome da escola')}</span></div><p class="muted">Prévia do cabeçalho do sistema da escola.</p></div>`,`<h2>Módulos liberados para o cliente</h2><div class="options">${MODULES.map(x=>`<label class="option"><input type="checkbox" name="module" value="${x[0]}" ${form.modules.includes(x[0])?'checked':''}>${x[1]}</label>`).join('')}</div>`,`<h2>Administrador inicial e revisão</h2><div class="two">${field('adminName','Nome do administrador',form.adminName)}${field('adminEmail','E-mail do administrador',form.adminEmail,'email')}</div><div class="preview"><h3>${esc(form.name||'Escola sem nome')}</h3><p>Plano: ${esc(form.plan)} • Mensalidade: ${money(form.price)} • Módulos: ${form.modules.length}</p><p>Ambiente: <strong>${esc(form.slug||'identificador-pendente')}</strong></p></div><div class="notice">Modo offline: o administrador é apenas um cadastro de configuração. Nenhum convite ou senha é enviado. Na versão de produção, o acesso exigirá autenticação segura.</div>`];layout(editing?'Personalizar escola':'Criar sistema escolar',`<div class="card wizard"><div class="eyebrow">Etapa ${step+1} de 5</div><div class="steps">${[0,1,2,3,4].map(i=>`<div class="step ${i<=step?'on':''}"></div>`).join('')}</div><form id="wizardform">${parts[step]}<div class="actions" style="margin-top:22px">${step>0?btn('← Voltar','prev','alt'):btn('Cancelar','cancel','alt')}${step<4?'<button class="btn" type="submit">Continuar →</button>':'<button class="btn" type="submit">'+(editing?'Salvar alterações':'Criar sistema escolar')+'</button>'}</div></form></div>`)}
function safeColor(c){return /^#[0-9a-f]{6}$/i.test(c||'')?c:'#475569'}function collectWizard(){let f=document.getElementById('wizardform');if(!f)return;new FormData(f).forEach((v,k)=>{if(k!=='module')form[k]=v});if(step===3)form.modules=[...f.querySelectorAll('[name=module]:checked')].map(x=>x.value);if(step===1){form.price=Number(form.price)||0}if(step===0){form.slug=String(form.slug||form.name).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}}function finishWizard(){if(!form.name.trim())return alert('Informe o nome da escola.');if(!form.slug)return alert('Informe o identificador da escola.');if(db.schools.some(s=>s.slug===form.slug&&s.id!==editing))return alert('Esse identificador já está sendo usado.');if(editing){let s=db.schools.find(x=>x.id===editing);Object.assign(s,form);s.color=safeColor(s.color);s.planName=(db.plans.find(p=>p.id===s.plan)||{}).name||'Personalizado';log('Escola atualizada: '+s.name)}else{let s={...form,id:uid(),createdAt:date(),students:[],staff:[],classes:[],attendance:[],grades:[],finance:[],messages:[],calendar:[],modules:[...form.modules],color:safeColor(form.color),planName:(db.plans.find(p=>p.id===form.plan)||{}).name||'Personalizado'};db.schools.push(s);log('Escola criada: '+s.name)}save();form={};editing=null;step=0;page='schools';render()}
function renderSchool(){let s=school();if(page==='overview'){layout('Painel escolar',`<div class="banner" style="background:linear-gradient(110deg,${safeColor(s.color)},#17213a)"><div class="schoolbar"><div class="avatar" style="background:#ffffff25">${s.logo?`<img src="${s.logo}">`:'🏫'}</div><div><h2 style="margin:0">${esc(s.name)}</h2><p>Gestão escolar personalizada • ${esc(s.city)}</p></div></div></div><div class="grid">${[['Alunos',s.students.length],['Profissionais',s.staff.length],['Turmas',s.classes.length],['Lançamentos de notas',s.grades.length]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="card"><h2>Atalhos da escola</h2><div class="actions">${[['students','Cadastrar aluno'],['classes','Organizar turmas'],['attendance','Abrir chamada'],['grades','Lançar notas'],['family','Portal da Família']].filter(x=>mod(s,x[0])).map(x=>btn(x[1],'nav:'+x[0],'alt')).join('')}</div></div><div class="notice">Ambiente offline de testes. As informações deste cliente ficam separadas das outras escolas dentro do aplicativo, mas não existe isolamento de segurança entre usuários por imagem.</div>`,btn('← Company','company','alt'));return}if(page==='settings'){layout('Configurações da escola',`<div class="card"><h2>${esc(s.name)}</h2><p>Plano ${esc(s.planName)} • ${money(s.price)}/mês</p><p>Administrador cadastrado: ${esc(s.adminName||'Não informado')} (${esc(s.adminEmail||'Sem e-mail')})</p><p>Identificador: ${esc(s.slug)}</p><p>Módulos: ${s.modules.map(k=>esc((MODULES.find(m=>m[0]===k)||[])[1]||k)).join(', ')}</p>${btn('Personalizar na Company','edit:'+s.id)}</div>`);return}if(page==='family'){layout('Portal da Família',`<div class="card"><h2>Consulta de acompanhamento</h2><p class="muted">Selecione um aluno para visualizar o resumo que seria exibido ao responsável.</p>${select('familyStudent','Aluno',s.students.map(x=>[x.id,x.name]),filter)}${btn('Visualizar acompanhamento','familyview')}</div><div id="familyresult"></div>`);return}if(page==='reports'){layout('Relatórios',`<div class="grid">${[['Alunos',s.students.length],['Professores',s.staff.filter(x=>x.role==='Professor').length],['Presenças registradas',s.attendance.filter(x=>x.status==='P').length],['Cobranças pendentes',s.finance.filter(x=>x.status==='Pendente').length]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div><div class="card">${btn('Exportar alunos CSV','csv:students','alt')}${btn('Exportar boletim CSV','csv:grades','alt')}</div>`);return}if(page==='attendance'){renderAttendance();return}if(page==='grades'){renderGrades();return}if(page==='students')renderGeneric('Alunos e matrículas','students',[['name','Nome completo'],['birth','Nascimento'],['guardian','Responsável'],['phone','Telefone'],['classId','Turma']]);else if(page==='staff')renderGeneric('Professores e equipe','staff',[['name','Nome'],['role','Função'],['email','E-mail'],['phone','Telefone']]);else if(page==='classes')renderGeneric('Turmas e disciplinas','classes',[['name','Turma / Série'],['year','Ano letivo'],['shift','Turno'],['subject','Disciplina(s)']]);else if(page==='finance')renderGeneric('Financeiro escolar','finance',[['studentId','Aluno'],['description','Descrição'],['amount','Valor (R$)'],['due','Vencimento'],['status','Situação']]);else if(page==='messages')renderGeneric('Comunicados','messages',[['title','Título'],['content','Mensagem'],['date','Data']]);else if(page==='calendar')renderGeneric('Calendário escolar','calendar',[['title','Evento'],['date','Data'],['description','Descrição']]);else {page='overview';render()}}
const labels={classId:'Turma',studentId:'Aluno',name:'Nome',birth:'Nascimento',guardian:'Responsável',phone:'Telefone',role:'Função',email:'E-mail',year:'Ano',shift:'Turno',subject:'Disciplinas',description:'Descrição',amount:'Valor',due:'Vencimento',status:'Situação',title:'Título',content:'Mensagem',date:'Data'};function shown(s,k,v){if(k==='classId')return (s.classes.find(x=>x.id===v)||{}).name||'—';if(k==='studentId')return (s.students.find(x=>x.id===v)||{}).name||'—';if(k==='amount')return money(v);return esc(v||'—')}
function renderGeneric(title,collection,fields){let s=school();layout(title,`<div class="card"><div class="actions">${btn('＋ Novo registro','add:'+collection)}${btn('Exportar CSV','csv:'+collection,'alt')}</div><div class="tablewrap"><table><thead><tr>${fields.map(x=>`<th>${x[1]}</th>`).join('')}<th>Ações</th></tr></thead><tbody>${s[collection].length?s[collection].map(row=>`<tr>${fields.map(x=>`<td>${shown(s,x[0],row[x[0]])}</td>`).join('')}<td>${btn('Editar','rowedit:'+collection+':'+row.id,'alt small')} ${btn('Excluir','rowdelete:'+collection+':'+row.id,'danger small')}</td></tr>`).join(''):`<tr><td colspan="${fields.length+1}" class="empty">Nenhum registro ainda</td></tr>`}</tbody></table></div></div>`,btn('← Company','company','alt'))}
function editRow(collection,id){let s=school(),row=id?s[collection].find(x=>x.id===id):{};let defs={students:[['name','Nome completo'],['birth','Nascimento','date'],['guardian','Responsável'],['phone','Telefone'],['classId','Turma','class']],staff:[['name','Nome'],['role','Função','role'],['email','E-mail','email'],['phone','Telefone']],classes:[['name','Turma / Série'],['year','Ano letivo','number'],['shift','Turno','shift'],['subject','Disciplinas']],finance:[['studentId','Aluno','student'],['description','Descrição'],['amount','Valor (R$)','number'],['due','Vencimento','date'],['status','Situação','status']],messages:[['title','Título'],['content','Mensagem'],['date','Data','date']],calendar:[['title','Evento'],['date','Data','date'],['description','Descrição']]};let fields=defs[collection].map(([k,l,t])=>t==='class'?select(k,l,[['','Sem turma'],...s.classes.map(x=>[x.id,x.name])],row[k]):t==='student'?select(k,l,s.students.map(x=>[x.id,x.name]),row[k]):t==='role'?select(k,l,['Professor','Diretor','Coordenador','Secretaria','Financeiro','Outro'].map(x=>[x,x]),row[k]):t==='shift'?select(k,l,['Matutino','Vespertino','Integral','Noturno'].map(x=>[x,x]),row[k]):t==='status'?select(k,l,['Pendente','Pago','Atrasado'].map(x=>[x,x]),row[k]):field(k,l,row[k]||'',t||'text',k==='name'||k==='title')).join('');layout((id?'Editar':'Novo')+' registro',`<div class="card wizard"><form id="recordform" data-collection="${collection}" data-id="${id||''}"><div class="two">${fields}</div><div class="actions"><button class="btn" type="submit">Salvar registro</button>${btn('Cancelar','nav:'+collection,'alt')}</div></form></div>`)}
function renderAttendance(){let s=school();let c=s.classes.find(x=>x.id===classId)||s.classes[0];if(c)classId=c.id;let students=s.students.filter(x=>x.classId===classId);let d=filter&&/^\d{4}-\d\d-\d\d$/.test(filter)?filter:date();layout('Diário de classe',`<div class="card"><div class="inline">${select('attendanceClass','Turma',s.classes.map(x=>[x.id,x.name]),classId)}${field('attendanceDate','Data da aula',d,'date')}${btn('Abrir chamada','loadattendance')}</div>${!s.classes.length?'<div class="notice">Cadastre uma turma primeiro.</div>':`<form id="attendanceform"><input type="hidden" name="classId" value="${esc(classId)}"><input type="hidden" name="date" value="${esc(d)}"><div class="tablewrap"><table><tr><th>Aluno</th><th>Presente</th><th>Faltou</th></tr>${students.map(st=>{let v=s.attendance.find(a=>a.studentId===st.id&&a.classId===classId&&a.date===d);return `<tr><td>${esc(st.name)}</td><td><input type="radio" name="st_${st.id}" value="P" ${!v||v.status==='P'?'checked':''}></td><td><input type="radio" name="st_${st.id}" value="F" ${v&&v.status==='F'?'checked':''}></td></tr>`}).join('')}</table></div>${students.length?'<button class="btn" type="submit">Salvar chamada</button>':'<p class="muted">Não há alunos vinculados a esta turma.</p>'}</form>`}</div>`)}
function renderGrades(){let s=school();layout('Notas e boletins',`<div class="card"><h2>Lançar avaliação</h2><form id="gradeform"><div class="two">${select('studentId','Aluno',s.students.map(x=>[x.id,x.name]))}${select('period','Período',[['1º Bimestre','1º Bimestre'],['2º Bimestre','2º Bimestre'],['3º Bimestre','3º Bimestre'],['4º Bimestre','4º Bimestre'],['1º Trimestre','1º Trimestre'],['2º Trimestre','2º Trimestre'],['3º Trimestre','3º Trimestre']],period)}${field('subject','Disciplina','Matemática','text',true)}${field('assessment','Avaliação','Prova','text',true)}${field('score','Nota (0 a 10)',0,'number',true)}${field('weight','Peso',1,'number',true)}</div><button class="btn" type="submit" ${!s.students.length?'disabled':''}>Salvar nota</button></form></div><div class="card"><h2>Notas registradas</h2><div class="tablewrap"><table><tr><th>Aluno</th><th>Período</th><th>Disciplina</th><th>Avaliação</th><th>Nota</th><th>Ação</th></tr>${s.grades.map(g=>`<tr><td>${shown(s,'studentId',g.studentId)}</td><td>${esc(g.period)}</td><td>${esc(g.subject)}</td><td>${esc(g.assessment)}</td><td>${esc(g.score)}</td><td>${btn('Excluir','rowdelete:grades:'+g.id,'danger small')}</td></tr>`).join('')}</table></div></div><div class="notice">Cálculo oficial de médias, recuperação e emissão de boletim exigem regras de avaliação específicas da escola. Esta tela registra notas de teste.</div>`)}
function download(name,contents,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([contents],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}function csv(collection){let s=school(),items=s[collection];let keys=[...new Set(items.flatMap(Object.keys))].filter(k=>k!=='id');let rows=[keys,...items.map(x=>keys.map(k=>x[k]??''))].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');download('myclass_'+collection+'_'+s.slug+'.csv','\ufeff'+rows,'text/csv;charset=utf-8')}
function formSubmit(e){if(e.target.id==='wizardform'){e.preventDefault();collectWizard();if(step===0&&!form.name.trim())return alert('Informe o nome da escola.');if(step<4){step++;render()}else finishWizard();return}if(e.target.id==='recordform'){e.preventDefault();let f=e.target,c=f.dataset.collection,id=f.dataset.id,o=Object.fromEntries(new FormData(f));if(!o.name&&!o.title&&['students','staff','classes','messages','calendar'].includes(c))return alert('Preencha o campo principal.');let arr=school()[c];if(id){Object.assign(arr.find(x=>x.id===id),o)}else arr.push({id:uid(),...o});log('Registro '+(id?'atualizado':'criado')+' em '+c+' / '+school().name);save();page=c;render();return}if(e.target.id==='attendanceform'){e.preventDefault();let f=e.target,s=school(),cid=f.elements.namedItem('classId').value,d=f.elements.namedItem('date').value;for(let st of s.students.filter(x=>x.classId===cid)){let radio=f.querySelector(`input[name="st_${st.id}"]:checked`);if(!radio)continue;let existing=s.attendance.find(x=>x.classId===cid&&x.studentId===st.id&&x.date===d);if(existing)existing.status=radio.value;else s.attendance.push({id:uid(),studentId:st.id,classId:cid,date:d,status:radio.value})}log('Chamada salva: '+s.name+' / '+d);save();alert('Chamada salva neste navegador.');render();return}if(e.target.id==='gradeform'){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(!o.studentId)return alert('Cadastre um aluno primeiro.');let score=Number(o.score),weight=Number(o.weight);if(!Number.isFinite(score)||score<0||score>10||weight<=0)return alert('Nota deve estar entre 0 e 10, com peso maior que zero.');school().grades.push({id:uid(),...o,score,weight});log('Nota lançada: '+school().name);save();render()}}
async function handleClick(e){let b=e.target.closest('[data-action],[data-nav]');if(!b)return;if(b.dataset.nav){page=b.dataset.nav;filter='';render();return}let a=b.dataset.action;if(a==='new'){mode='company';page='create';editing=null;form={};step=0;render()}else if(a==='cancel'){page='schools';form={};editing=null;step=0;render()}else if(a==='prev'){collectWizard();step=Math.max(0,step-1);render()}else if(a==='company'){mode='company';page='schools';render()}else if(a.startsWith('open:')){sid=a.slice(5);mode='school';page='overview';filter='';render()}else if(a.startsWith('edit:')){sid=null;mode='company';editing=a.slice(5);page='create';step=0;form={};render()}else if(a.startsWith('toggle:')){let s=db.schools.find(x=>x.id===a.slice(7));s.status=s.status==='active'?'suspended':'active';log('Situação alterada: '+s.name);save();render()}else if(a.startsWith('nav:')){page=a.slice(4);render()}else if(a.startsWith('add:'))editRow(a.slice(4));else if(a.startsWith('rowedit:')){let [,col,id]=a.split(':');editRow(col,id)}else if(a.startsWith('rowdelete:')){let [,col,id]=a.split(':');if(confirm('Excluir este registro de teste?')){school()[col]=school()[col].filter(x=>x.id!==id);save();render()}}else if(a.startsWith('csv:'))csv(a.slice(4));else if(a.startsWith('editplan:')){let p=db.plans.find(x=>x.id===a.slice(9)),v=prompt('Mensalidade do plano '+p.name+' (R$)',p.price);if(v!==null&&Number(v)>=0){p.price=Number(v);save();render()}}else if(a==='export')download('BOLT Class_backup_'+date()+'.json',JSON.stringify(db,null,2),'application/json');else if(a==='import')document.getElementById('importfile').click();else if(a==='wipe'){if(confirm('Apagar TODOS os dados locais de teste? Esta ação é irreversível sem backup.')&&confirm('Confirma a exclusão de todas as escolas?')){db=blank();save();page='dashboard';render()}}else if(a==='loadattendance'){classId=document.querySelector('[name=attendanceClass]').value;filter=document.querySelector('[name=attendanceDate]').value;render()}else if(a==='familyview'){let id=document.querySelector('[name=familyStudent]').value,st=school().students.find(x=>x.id===id);if(!st)return alert('Cadastre alunos primeiro.');let notes=school().grades.filter(x=>x.studentId===id),atts=school().attendance.filter(x=>x.studentId===id);document.getElementById('familyresult').innerHTML=`<div class="card"><h2>${esc(st.name)}</h2><p>Turma: ${shown(school(),'classId',st.classId)} • Responsável: ${esc(st.guardian)}</p><p>Presenças: ${atts.filter(x=>x.status==='P').length} • Faltas: ${atts.filter(x=>x.status==='F').length}</p><h3>Notas</h3>${notes.map(n=>`<p>${esc(n.subject)} — ${esc(n.period)}: <strong>${esc(n.score)}</strong></p>`).join('')||'<p>Sem notas lançadas.</p>'}</div>`}}
function handleChange(e){if(e.target.id==='importfile'){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!Array.isArray(obj.schools)||!Array.isArray(obj.plans))throw Error('Formato inválido');if(!confirm('Substituir todos os dados atuais pelo backup selecionado?'))return;db=obj;save();page='dashboard';mode='company';render()}catch(err){alert('Arquivo inválido: '+err.message)}};reader.readAsText(f)}if(e.target.id==='logoFile'){let f=e.target.files[0];if(!f)return;if(f.size>300000)return alert('Use uma imagem com até 300 KB para não lotar o armazenamento local.');collectWizard();let reader=new FileReader();reader.onload=()=>{form.logo=reader.result;render()};reader.readAsDataURL(f)}if(e.target.name==='search'){filter=e.target.value;render()}}

function fieldExtra(s,key,label,type,value){let options=[];if(type==='student')options=s.students.map(x=>[x.id,x.name]);if(type==='class')options=s.classes.map(x=>[x.id,x.name]);if(type==='staff')options=s.staff.map(x=>[x.id,x.name]);if(type==='subject')options=s.subjects.map(x=>[x.id,x.name]);if(type?.startsWith('options:'))options=type.slice(8).split('|').map(x=>[x,x]);if(options.length||['student','class','staff','subject'].includes(type))return `<label class="field">${esc(label)}<select name="${key}"><option value="">Selecione</option>${opt(options,value)}</select></label>`;if(['Descrição','Observações','Orientações','Ata / resumo','Encaminhamentos','Registro','Providência','Ementa'].includes(label))return `<label class="field">${esc(label)}<textarea name="${key}" rows="3">${esc(value)}</textarea></label>`;return field(key,label,value,type||'text');}
function labelExtra(s,key,value,type){if(!value)return '—';if(type==='student')return esc(s.students.find(x=>x.id===value)?.name||'Aluno não encontrado');if(type==='class')return esc(s.classes.find(x=>x.id===value)?.name||'Turma não encontrada');if(type==='staff')return esc(s.staff.find(x=>x.id===value)?.name||'Profissional não encontrado');if(type==='subject')return esc(s.subjects.find(x=>x.id===value)?.name||'Disciplina não encontrada');return esc(value);}
