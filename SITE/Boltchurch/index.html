/* Login cinematográfico Sua igreja — logo original, sem distorção */
.welcome{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;isolation:isolate;overflow:hidden;padding:38px 18px 65px;background:#0b142e;color:#fff;text-align:center}
.welcome:before{content:"";position:absolute;inset:0;z-index:-2;background:none;animation:churchZoom 18s ease-out both}
.welcome:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(4,12,37,.77),rgba(7,15,42,.42) 54%,rgba(8,14,37,.17)),linear-gradient(0deg,rgba(2,9,35,.9),transparent 28%)}
.welcome-brand{width:min(480px,80vw);margin:0 auto 14px;filter:drop-shadow(0 4px 18px #0009);animation:riseIn .9s ease both}
.welcome-brand img{display:block;width:100%;height:auto;object-fit:contain;aspect-ratio:2019/779}
.welcome-subtitle{font-size:clamp(11px,1.5vw,16px);letter-spacing:.23em;margin:0 0 24px;color:#f2f4ff;text-shadow:0 2px 10px #000}
.login-panel{width:min(480px,100%);padding:25px 28px 28px;border:1px solid #d4d7ff55;border-radius:27px;background:rgba(18,19,49,.69);box-shadow:0 20px 85px #0009;backdrop-filter:blur(18px);text-align:left;animation:riseIn 1s ease both}
.login-panel label{display:block;margin:0 0 15px;font-size:13px;color:#dce3ff}
.login-panel input{display:block;width:100%;margin-top:7px;padding:16px 17px;border-radius:15px;background:rgba(18,18,44,.58);border:1px solid #e0e4ff68;color:white;font-size:16px;outline:none}
.login-panel input:focus{border-color:#54aaff;box-shadow:0 0 0 3px #3294ff35}
.login-panel .enter-button{width:100%;border:1px solid #408aff;border-radius:15px;background:linear-gradient(100deg,#1c1a9b,#087bfa);color:#fff;padding:17px;font-size:17px;font-weight:700;cursor:pointer;transition:transform .2s,filter .2s}
.login-panel .enter-button:hover{transform:translateY(-2px);filter:brightness(1.13)}
.login-error{color:#ffd1d1;background:#a8203740;border:1px solid #ff9aa755;border-radius:10px;padding:10px;margin:0 0 14px}
.login-help{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:4px 0 20px;color:#e3e8ff;font-size:13px}
.login-help label{display:flex;align-items:center;gap:8px;margin:0}.login-help input{width:auto;margin:0}
.login-help button{border:0;background:none;color:#64b2ff;cursor:pointer}
.login-features{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:26px 0 0;font-size:13px;color:#f3f4ff;text-shadow:0 2px 9px #000}
.login-features span+span{border-left:1px solid #fff6;padding-left:18px}
.welcome-caption{position:absolute;bottom:13px;left:0;right:0;color:#e2e8ffb0;font-size:10px;letter-spacing:.14em}
.splash{position:fixed;inset:0;z-index:80;background:#09162d;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:26px;animation:fadeIn .4s ease}
.splash img{width:min(270px,62vw);height:auto;object-fit:contain;animation:emerge 1.3s cubic-bezier(.18,.75,.28,1) both}
.splash-tagline{font-size:clamp(17px,3vw,23px);animation:riseIn .9s .85s both}.splash-tagline strong{color:#b9dfff}
@keyframes churchZoom{from{transform:scale(1.04)}to{transform:scale(1)}}@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes emerge{from{opacity:0;transform:translateY(20px) scale(.9);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:540px){.welcome{padding:26px 14px 58px}.welcome-brand{width:min(320px,83vw)}.welcome-subtitle{letter-spacing:.11em}.login-panel{padding:23px 19px}.login-features{gap:10px;font-size:11px}.login-features span+span{padding-left:10px}}
@media(prefers-reduced-motion:reduce){.welcome:before,.welcome-brand,.login-panel,.splash img,.splash-tagline{animation:none}}

ademyAttendanceDashboard(c,enrolled,lessons,marked,present){const pct=marked?Math.round(present/marked*100):0;const rows=lessons.map(l=>{const a=db.attendance.filter(x=>x.courseId===c.id&&x.lessonId===l.id),p=a.filter(x=>x.present).length;return `<div class="v7-barrow"><span>${esc(l.topic||'Aula')}</span><div class="v7-track"><div style="width:${a.length?Math.round(p/a.length*100):0}%"></div></div><strong>${a.length?Math.round(p/a.length*100)+'%':'—'}</strong></div>`}).join('');return `<section class="v7-dash"><div><span class="academy-eyebrow">ANÁLISE ACADÊMICA</span><h2>Presença e desempenho</h2><p>Indicadores calculados com as chamadas registradas.</p></div><div class="v7-metrics"><div><small>MATRICULADOS</small><strong>${enrolled.length}</strong></div><div><small>PRESENÇAS</small><strong>${present}</strong></div><div><small>FALTAS</small><strong>${marked-present}</strong></div><div><small>FREQUÊNCIA</small><strong>${marked?pct+'%':'—'}</strong></div></div><div class="v7-chart"><h3>Frequência por aula</h3>${rows||'<p>Cadastre aulas para visualizar o gráfico.</p>'}</div><details><summary>Histórico de frequência por aluno</summary><div class="v7-history">${enrolled.map(e=>{const m=db.members.find(x=>x.id===e.memberId),a=db.attendance.filter(x=>x.courseId===c.id&&x.memberId===e.memberId);return m?`<div><b>${esc(m.name)}</b><span>${a.filter(x=>x.present).length} presenças · ${a.filter(x=>!x.present).length} faltas · ${a.length?Math.round(a.filter(x=>x.present).length/a.length*100)+'%':'sem registros'}</span></div>`:''}).join('')||'<p>Nenhum aluno matriculado.</p>'}</div></details></section>`}
function communicationPanel(m){const now=new Date(),month=now.getMonth(),year=now.getFullYear(),monthName=now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),events=db.events.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date)),birth=db.members.filter(x=>x.birth&&Number(x.birth.slice(5,7))===month+1).sort((a,b)=>a.birth.slice(8).localeCompare(b.birth.slice(8))),steps=['Criar arte','Revisar e aprovar','Publicar'];const tasks=events.flatMap(e=>steps.map((_,i)=>!!m.commTasks?.[e.id+'_'+i]));const completed=tasks.filter(Boolean).length;const task=(key,label)=>`<label class="comm-check"><input type="checkbox" ${m.commTasks?.[key]?'checked':''} ${role!=='admin'?'disabled':''} onchange="toggleCommTask('${m.id}','${key}',this.checked)"><span>${label}</span></label>`;return `<section class="comm-board"><div class="comm-hero"><div><span class="academy-eyebrow">✦ PIB STUDIO · COMUNICAÇÃO</span><h2>Ideias que comunicam.<br><em>Mensagens que alcançam.</em></h2><p>Central de criação, planejamento e publicação · ${esc(monthName)}</p></div><div class="comm-hero-symbol">✳</div></div><div class="comm-metrics"><div><small>PROGRAMAÇÕES</small><strong>${events.length}</strong><span>Eventos no calendário</span></div><div><small>ETAPAS CONCLUÍDAS</small><strong>${completed}<span>/${tasks.length}</span></strong><span>Fluxo de produção</span></div><div><small>ANIVERSARIANTES</small><strong>${birth.length}</strong><span>Artes do mês</span></div></div><div class="comm-columns"><div class="comm-work"><div class="comm-title"><div><span class="academy-eyebrow">PRODUÇÃO CRIATIVA</span><h3>Fila de programações</h3></div><span class="tag2">${events.length} pautas</span></div>${events.map(e=>{const count=steps.filter((_,i)=>m.commTasks?.[e.id+'_'+i]).length;return `<article class="comm-event"><div class="comm-event-top"><span class="comm-date">${esc((e.date||'').slice(8,10))}<small>${esc((e.date||'').slice(5,7))}</small></span><div><h4>${esc(e.name)}</h4><p>${fmt(e.date)} · ${esc(e. function openModal(type,ref='',item='',moduleId=''){modal=[type,ref,item,moduleId].join('|');render()}function closeModal(){modal='';render()}function modalHtml(){let [type,ref,item,moduleId]=modal.split('|'),data=type==='member'?db.members.find(x=>x.id===ref):type==='ministry'?db.ministries.find(x=>x.id===ref):type==='event'?db.events.find(x=>x.id===ref):type==='notice'?db.notices.find(x=>x.id===ref):type==='course'?db.courses.find(x=>x.id===ref):null;data||={};let title='',fields='';if(type==='member'){title=ref?'Editar membro':'Cadastrar membro';fields=f('Nome completo','name',data.name,'text',true)+f('Data de nascimento','birth',data.birth,'date')+f('Telefone / WhatsApp','phone',data.phone,'tel')+f('E-mail','email',data.email,'email')+sel('Estado civil','marital',['','Solteiro(a)','Casado(a)','Divorciado(a)','Viúvo(a)','União estável'],data.marital)+f('Profissão','job',data.job)+f('Data do batismo','baptismDate',data.baptismDate,'date')+f('Igreja onde foi batizado(a)','baptismChurch',data.baptismChurch)+f('Data de entrada na igreja','joined',data.joined,'date')+sel('Situação','status',['Ativo','Inativo','Visitante','Transferido'],data.status||'Ativo')+f('CEP','zip',data.zip)+f('Endereço completo','address',data.address)+f('Cidade','city',data.city)+f('Nome do cônjuge','spouse',data.spouse)+f('Contato de emergência','emergency',data.emergency)+f('Cargo / função','position',data.position)+textarea('Observações','notes',data.notes)+`<div class="field full">Grupos e ministérios vinculados<div style="display:flex;flex-wrap:wrap;gap:12px">${db.ministries.map(m=>`<label><input type="checkbox" name="ministries" value="${m.id}" ${(data.ministries||[]).includes(m.id)?'checked':''}> ${esc(m.name)}</label>`).join('')}</div></div><div class="field full">Liderança por grupo/ministério<div style="display:flex;flex-wrap:wrap;gap:12px">${db.ministries.map(m=>`<label><input type="checkbox" name="leadingMinistries" value="${m.id}" ${(data.leadingMinistries||[]).includes(m.id)?'checked':''}> Líder de ${esc(m.name)}</label>`).join('')}</div></div>`}else if(type==='ministry'){title=ref?'Editar ministério':'Criar ministério';fields=f('Nome do ministério','name',data.name,'text',true)+f('Ícone (emoji)','emoji',data.emoji||'✦')+f('Líder responsável','leader',data.leader)+textarea('Descrição','description',data.description)+uploadField('Foto de perfil','profileImage',data.profileImage)+uploadField('Imagem de banner','bannerImage',data.bannerImage)}else if(type==='event'){title='Atividade da igreja';fields=f('Nome','name',data.name,'text',true)+f('Data','date',data.date,'date',true)+f('Horário','time',data.time)+f('Local','place',data.place)+textarea('Detalhes','description',data.description)}else if(type==='notice'){title='Comunicado';fields=f('Título','title',data.title,'text',true)+textarea('Mensagem','body',data.body)}else if(type==='course'){title='Curso acadêmico';fields=f('Nome do curso','name',data.name,'text',true)+f('Data de início','startDate',data.startDate,'date',true)+f('Professor','teacher',data.teacher)+f('Dias e horários','schedule',data.schedule)+textarea('Descrição','description',data.description)}else if(type==='module'){const c=db.courses.find(x=>x.id===ref);data=(c?.modules||[]).find(m=>m.id===item)||{};title=item?'Editar módulo':'Criar módulo';fields=f('Nome do módulo','name',data.name,'text',true)+f('Carga horária estimada','duration',data.duration,'number')+textarea('Apresentação e objetivos','description',data.description)}else if(type==='post'){title='Nova publicação ministerial';fields=f('Título da publicação','title','','text',true)+f('Data','date','','date')+f('Local','place')+textarea('Texto e detalhes','body')}else if(type==='lesson'){const c=db.courses.find(x=>x.id===ref);data=(c?.lessons||[]).find(l=>l.id===item)||{};title=item&&item!=='new'?'Editar aula':'Adicionar aula';fields=f('Tema da aula','topic',data.topic,'text',true)+`<label class="field">Módulo<select name="moduleId"><option value="">Aulas anteriores / se " ${a?.present===true?'checked':''}><span>✓ Presente</span></label><label class="attendance-choice absent"><input type="radio" name="roll_${esc(m.id)}" value="absent" ${a?.present===false?'checked':''}><span>✕ Faltou</span></label><label class="attendance-choice pending"><input type="radio" name="roll_${esc(m.id)}" value="" ${!a?'checked':''}><span>—</span></label></div></div>`:''}).join('')+'</div>';if(!enrolled.length)fields+='<p class="field full">Matricule alunos para abrir a chamada.</p>'}else if(type==='enroll'){title='Matricular aluno';fields=`<label class="field full">Selecione o membro<select name="memberId">${db.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label>`}else if(type==='devotional'){title='Agendar devocional';fields=f('Data de publicação (às 5h)','date',new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'}),'date',true)+f('Referência bíblica','ref')+textarea('Versículo','text')+textarea('Reflexão','body')}else if(type==='access'){title='Criar acesso';fields=f('E-mail de acesso','email','','email',true)+sel('Perfil','accessRole',['leader','member'],'leader')+`<label class="field full">Vincular ao membro<select name="memberId"><option value="">Selecione</option>${db.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label>`+`<div class="field full">Ministérios autorizados<div>${db.ministries.map(m=>`<label style="display:inline-flex;gap:5px;margin:8px"><input type="checkbox" name="ministries" value="${m.id}">${esc(m.name)}</label>`).join('')}</div></div>`}return `<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="section-head"><h2>${title}</h2>${btn('✕','closeModal()','ghost')}</div><form onsubmit="submitForm(event,'${type}','${ref}','${item}')"><div class="formgrid">${fields}</div><div class="modalfooter">${ref&&['member','ministry','event','notice','course'].includes(type)?btn('Excluir',`removeItem('${type}','${ref}')`,'danger'):''}<button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></div></div>`}async function submitForm(e,type,ref,item=''){e.preventDefault();let fd=new FormData(e.target),obj=Object.fromEntries(fd.entries());if(type==='rollcall'){if(role!=='admin')return;for(const en of db.enrollments.filter(x=>x.courseId===ref)){const v=fd.get('roll_'+en.memberId);db.attendance=db.attendance.filter(x=>!(x.courseId===ref&&x.lessonId===item&&x.memberId===en.memberId));if(v==='present'||v==='absent')db.attendance.push({id:id(),courseId:ref,lessonId:item,memberId:en.memberId,present:v==='present'})}await save();closeModal();return}if(type==='access'){await inviteAccount(obj,fd.getAll('ministries'));return}if(type==='member'){obj.ministries=fd.getAll('ministries');obj.leadingMinistries=fd.getAll('leadingMinistries').filter(x=>obj.ministries.includes(x));if(!obj.name.trim())return;upsert('members',obj,ref)}else if(type==='ministry'){if(role!=='admin')return;try{for(const field of ['profileImage','bannerImage']){const file=fd.get(field);if(file instanceof File&&file.size){obj[field]=await uploadMinistryImage(file,ref||'new',field)}else{delete obj[field]}}}catch(err){alert('Não foi possível enviar a imagem: '+err.message);return}upsert('ministries',obj,ref)}else if(type==='event')upsert('events',obj,ref);else if(type==='notice')upsert('notices',obj,ref);else if(type==='course')upsert('courses',obj,ref);else if(type==='post'){let m=db.ministries.find(x=>x.id===ref);if(m)(m.posts??=[]).push({...obj,id:id()})}else if(type==='module'){if(role!=='admin')return;let c=db.courses.find(x=>x.id===ref);if(c){c.modules??=[];let m=c.modules.find(x=>x.id===item);if(m)Object.assign(m,obj);else c.modules.push({...obj,id:id()})}}else if(type==='lesson'){if(role!=='admin')return;let c=db.courses.find(x=>x.id===ref);if(c){c.lessons??=[];let l=c.lessons.find(x=>x.id===item);if(l)Object.assign(l,obj);else c.lessons.push({...obj,id:id()})}}else if(type==='material'){let c=db.courses.find(x=>x.id===ref);if(c)(c.materials??=[]).push(obj)}else if(type==='enroll'){if(obj.memberId&&!db.enrollments.some(x=>x.courseId===ref&&x.memberId===obj.memberId))db.enrollments.push({id:id(),courseId:ref,memberId:obj.memberId})}else if(type==='devotional'){db.devotionals=db.devotionals||[];db.devotionals=db.devotionals.filter(x=>x.date!==obj.date);db.devotionals.push({...obj,id:id()})}await save();closeModal()}function upsert(key,obj,ref){if(ref){let idx=db[key].findIndex(x=>x.id===ref);if(idx>=0)db[key][idx]={...db[key][idx],...obj}}else db[key].push({...obj,id:id()})}function removeItem(type,ref){if(role!=='admin'||!confirm('Excluir este registro?'))return;let key={member:'members',ministry:'ministries',event:'events',notice:'notices',course:'courses'}[type];db[key]=db[key].filter(x=>x.id!==ref);save();closeModal()}function exportBackup(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='bolt-church-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importBackup(input){let file=input.files[0];if(!file)return;file.text().then(t=>{let d=JSON.parse(t);if(!Array.isArray(d.members)||!Array.isArray(d.ministries))throw Error('Formato inválido');if(confirm('Substituir os dados desta igreja pelos do backup?')){db=d;save();go('home')}}).catch(()=>alert('Arquivo JSON inválido.'))}
