<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>BOLT Church · Portal do membro</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#20344d;font:15px/1.6 system-ui}.member-shell{max-width:960px;margin:auto;padding:24px 20px 150px}.member-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0;border-bottom:1px solid #dce4ee}.member-header img{width:85px;max-height:75px;object-fit:contain}.member-card{background:white;border:1px solid #dce4ee;border-radius:18px;padding:26px;margin:22px 0}.member-login{width:min(430px,calc(100vw - 32px));margin:10vh auto}.member-login img{width:220px;display:block;margin:0 auto 24px;filter:url(#bolt-member-white)}body:has(.member-login){background:#0f182c;color:#fff}.member-login.member-card{background:#18263d;border-color:#3b4f6b}.member-card h1{letter-spacing:-1px;line-height:1.2}.member-card label{display:block;margin:16px 0}.member-card input{width:100%;border:1px solid #b9c8dc;border-radius:10px;padding:13px;font:16px system-ui}.member-card button,.member-header button{background:#304f7b;color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}.member-tabs{display:flex;gap:8px;overflow-x:auto;margin:22px 0}.member-tabs button{border:1px solid #d9e2ef;border-radius:30px;background:#fff;color:#45607e;padding:11px 20px;font:inherit;cursor:pointer}.member-tabs button[aria-selected=true]{background:#304f7b;color:#fff}.member-entry{padding:16px 0;border-top:1px solid #e2e8f0}.member-entry p{white-space:pre-wrap}small,.member-muted{color:#7e8fa6}#member-error{color:#eab7aa}.member-identity{display:flex;align-items:center;gap:16px}@media(max-width:600px){.member-shell{padding:15px 15px 160px}.member-card{padding:22px}.member-header h2{font-size:18px}}@media(display-mode:standalone){.member-shell{padding-top:calc(16px + env(safe-area-inset-top))}}</style></head><body><div id="member-root"></div><script src="/bolt-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/member.js"></script><script src="/bolt-shell.js" defer></script></body></html>
