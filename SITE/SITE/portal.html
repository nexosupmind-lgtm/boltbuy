<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOLT • Acesso do cliente</title><style>body{margin:0;background:radial-gradient(circle at top,#392467,#090b19 70%);color:#fff;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(440px,90vw);padding:30px;background:#15152bdc;border:1px solid #775ca5;border-radius:22px;box-shadow:0 22px 80px #0007}h1{margin-top:0}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;margin:8px 0;font:inherit}input{background:#0c0f20;color:#fff;border:1px solid #66628a}button{background:#8359f5;color:#fff;border:0;font-weight:700;cursor:pointer}small{color:#b7b2d1}#msg{overflow-wrap:anywhere}</style></head><body><main><img id="niche-logo" alt="Marca BOLT" style="display:block;width:min(100%,300px);height:125px;object-fit:contain;margin:0 auto 12px"><h1 style="text-align:center">Acesso <span id="brand"></span></h1><p>Acesso do responsável</p><form id="login"><input id="email" type="email" required placeholder="E-mail"><input id="password" type="password" required placeholder="Senha"><button>Entrar</button></form><p id="msg" role="status"></p><div id="details" hidden></div><small>Ambiente de homologação. O cadastro comercial e o acesso estão conectados ao Supabase. O sistema operacional completo ainda não está habilitado neste portal.</small></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/bolt-config.js"></script><script>
(async()=>{const q=new URLSearchParams(location.search),product=q.get('product'),slug=q.get('slug'),msg=document.getElementById('msg');document.getElementById('niche-logo').src='/bolt-'+(product==='church'?'church':product==='class'?'class':'buy')+'-brand.png';document.getElementById('brand').textContent=product==='church'?'CHURCH':product==='class'?'CLASS':'';if(!['church','class'].includes(product)||!slug){msg.textContent='Endereço inválido.';document.getElementById('login').hidden=true;return}const cfg=window.BOLT_CONFIG;const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);document.getElementById('login').onsubmit=async e=>{e.preventDefault();msg.textContent='Validando…';const {data,error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent='E-mail ou senha inválidos.';return}const r=await sb.from('bolt_commercial_memberships').select('role,bolt_commercial_clients!inner(name,slug,product,status)').eq('user_id',data.user.id).eq('bolt_commercial_clients.slug',slug).eq('bolt_commercial_clients.product',product);if(r.error||!r.data?.length){await sb.auth.signOut();msg.textContent='Conta não autorizada para esta organização.';return}const c=r.data[0].bolt_commercial_clients;if(c.status==='paused'){await sb.auth.signOut();msg.textContent='Organização pausada.';return}document.getElementById('login').hidden=true;msg.textContent='Acesso autenticado com sucesso.';const d=document.getElementById('details');d.hidden=false;d.textContent='Organização: '+c.name+' • Perfil: '+r.data[0].role+' • Módulo operacional ainda não integrado.';const cl=await sb.from('bolt_commercial_clients').select('id').eq('product',product).eq('slug',slug).single();if(!cl.error){const br=await sb.from('bolt_client_branding').select('primary_color,secondary_color,logo_url,banner_url').eq('client_id',cl.data.id).maybeSingle();if(!br.error&&br.data){const b=br.data;document.querySelector('button').style.background=b.primary_color;document.querySelector('main').style.background=b.secondary_color+'ef';if(b.logo_url){const img=document.createElement('img');img.src=b.logo_url;img.alt='Logo da organização';img.style.cssText='width:120px;height:90px;object-fit:contain;display:block;margin:auto';document.querySelector('main').prepend(img)}if(b.banner_url){document.body.style.background='linear-gradient(#090b19b8,#090b19d9),url('+JSON.stringify(b.banner_url)+') center/cover fixed'}}}};})();
</script></body></html>
