<!doctype html><html lang="pt-BR"><head><script>
(function(){
 const slug=new URLSearchParams(location.search).get('slug')||'';
 if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)||slug.length>80)return;
 const icon=document.createElement('link');
 icon.rel='apple-touch-icon';icon.href='/api/family-icon?slug='+encodeURIComponent(slug)+'&v=2';
 document.head.append(icon);
 const manifest=document.createElement('link');
 manifest.rel='manifest';manifest.href='/api/app-manifest?product=class&surface=family&slug='+encodeURIComponent(slug);
 document.head.append(manifest);
})();
</script><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Portal da Família</title><style>
:root{--accent:#475569;--ink:#18334c;--muted:#6d8093;--bg:#f0f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.shell{max-width:940px;margin:auto;min-height:100dvh;background:#f8fbfe;padding-bottom:100px}.header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;background:var(--accent);color:var(--on-accent,#fff)}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.brand img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:12px;padding:3px}.brand small{display:block;opacity:.8;font-size:11px;letter-spacing:1px;margin-top:4px}.main{padding:24px}.card,.student{background:white;padding:22px;border:1px solid #e0eaf3;border-radius:20px;margin-bottom:16px}.welcome{padding:24px;border-radius:20px;background:color-mix(in srgb,var(--accent) 16%,white);margin-bottom:16px}.welcome h1{font-size:27px;margin:4px 0 10px;overflow-wrap:anywhere}.welcome small{font-weight:800}.student{display:flex;align-items:center;gap:18px}.photo{display:grid;place-items:center;flex:0 0 76px;width:76px;height:76px;background:#e3f2ff;border-radius:20px;overflow:hidden;font-size:30px}.photo img{width:100%;height:100%;object-fit:cover}.student h2{margin:3px 0}.muted,small{color:var(--muted)}.header small{color:inherit}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.metric{padding:18px;border-radius:18px;background:#dff2ff}.metric:nth-child(2){background:#fff2b9}.metric:nth-child(3){background:#ffe1eb}.metric strong{display:block;font-size:27px;margin:7px 0}.metric small{font-size:11px}.entry{padding:14px 0;border-bottom:1px solid #e7eef5}.entry:last-child{border:0}.entry h3,.entry p{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}.entry small{font-size:12px}.score{float:right;font-weight:850;color:var(--accent)}.nav{display:flex;justify-content:space-around;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(940px,100%);background:white;border-top:1px solid #e0eaf3;padding:12px 5px max(12px,env(safe-area-inset-bottom));box-shadow:0 -4px 20px #15324d0a}.nav button{flex:1;min-width:0;border:0;background:none;color:var(--muted);padding:7px 2px;font-size:11px}.nav button span{display:block;font-size:20px;margin-bottom:4px}.nav button.active{color:var(--accent);font-weight:850}.btn{border:0;background:var(--accent);color:var(--on-accent,#fff);padding:12px 16px;border-radius:12px;font-weight:700}.header .btn{border:1px solid #ffffff70;background:#ffffff15;color:white}.login{max-width:450px;margin:8vh auto;padding:30px}.login h1{text-align:center}.login label{display:block;margin:14px 0;font-size:13px}.login input,.password-form input{width:100%;padding:14px;border:1px solid #cfdae6;background:#f8fbfe;border-radius:12px;margin-top:7px}.login .btn{width:100%;margin-top:8px}.login-logo{max-width:160px;max-height:90px;object-fit:contain;display:block;margin:0 auto 18px}.status{padding:14px;color:#9d2543;overflow-wrap:anywhere}.preview-bar{padding:14px 22px;background:#fff3c8;color:#6f5517;font-size:13px}.preview-bar select{margin:8px 0 0;padding:9px;border:1px solid #d8c787;border-radius:9px;max-width:100%;width:100%}.preview-bar strong{display:block}.account-actions{margin-top:18px}.account-actions summary{cursor:pointer;font-weight:700}.password-form{margin-top:14px}.password-form button{margin-top:12px}a{color:var(--accent)}
@media(max-width:600px){.main{padding:14px}.header{padding:16px}.brand{font-size:14px}.metrics{gap:8px}.metric{padding:13px 9px}.metric strong{font-size:23px}.welcome h1{font-size:23px}.nav button{font-size:10px}.login{margin:6vh 16px;padding:24px}.student{padding:17px}.photo{flex-basis:62px;width:62px;height:62px}}

.shell{background:#f6f7fc}
.header{justify-content:center;min-height:96px;padding:12px 20px;background:var(--accent);color:var(--on-accent,#fff)}
.school-logo{display:block;width:min(74vw,280px);height:72px;object-fit:contain}
.school-name{text-align:center;font-size:20px;font-weight:800}
.main{max-width:760px;margin-inline:auto}
.welcome{padding:18px 16px;margin-bottom:8px;background:transparent;color:#17263a}
.welcome small,.student small{font-size:11px;letter-spacing:.08em;font-weight:750;color:#4b596c}
.welcome h1{font-size:clamp(24px,6vw,34px);line-height:1.15;margin:6px 0}
.welcome p{margin:0;color:#435269;line-height:1.45}
.student{border-radius:18px;box-shadow:0 3px 12px #17263a08}
.student h2{font-size:clamp(17px,4.8vw,23px);line-height:1.2;overflow-wrap:anywhere}
.student p{margin:4px 0 0}
.student .photo{border-radius:50%}
.muted,.metric small,.entry small{color:#4b596c}
.overview h2,.main .card h2{font-size:18px;margin:0 0 10px}
.metrics{margin:0 0 16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.metrics .metric{display:grid;grid-template-rows:minmax(2.4em,auto) auto 1fr;gap:4px;background:color-mix(in srgb,var(--accent) 7%,white);border:1px solid color-mix(in srgb,var(--accent) 14%,white);min-width:0;overflow-wrap:anywhere}
.metric strong{margin:0;line-height:1.1}
.shell{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));inset:auto 0 0;margin-inline:auto;transform:none;z-index:10;padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
.nav>button,.family-menu summary{display:grid;align-content:center;justify-items:center;min-height:50px;padding:4px 0;font-size:clamp(10px,2.8vw,12px);color:var(--ink);line-height:1.2}
.nav>button span,.family-menu summary span{font-size:22px;margin:0 0 3px}
.nav>button.active{background:color-mix(in srgb,var(--accent) 12%,white);color:var(--ink);border-radius:10px}
.family-menu summary{cursor:pointer;list-style:none}
.family-menu summary::-webkit-details-marker{display:none}
.family-menu>div{position:absolute;right:8px;bottom:100%;display:grid;min-width:160px;padding:6px;background:#fff;border:1px solid #e0eaf3;border-radius:14px;box-shadow:0 8px 28px #13213d33}
.family-menu button{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px;color:var(--ink);font-size:14px}
.family-menu img{width:25px;height:25px;object-fit:contain}
/* Destaques da tela inicial */
.welcome{position:relative;isolation:isolate;overflow:hidden;padding:24px 18px;background:color-mix(in srgb,var(--accent) 10%,white);border-radius:22px;margin-bottom:14px}
.welcome-art{position:absolute;right:12px;top:-30px;z-index:-1;font-size:136px;line-height:1;color:color-mix(in srgb,var(--accent) 16%,white);pointer-events:none}
.metrics .metric{grid-template-rows:auto minmax(2.4em,auto) auto 1fr;gap:6px}
.metric-icon{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:#fff;color:#17263a;font-weight:800}
.feed-heading{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.feed-heading button{border:0;border-radius:10px;min-height:44px;padding:6px 10px;background:color-mix(in srgb,var(--accent) 10%,white);color:#17263a;font-size:13px;font-weight:700}
@media(prefers-reduced-motion:no-preference){
 .welcome-art{animation:family-spark 700ms ease-out both}
 .nav button,.feed-heading button{transition:transform 140ms ease}
 .nav button:active,.feed-heading button:active{transform:scale(.95)}
 @keyframes family-spark{from{transform:translateY(14px) rotate(-18deg);opacity:0}to{transform:translateY(0) rotate(0);opacity:1}}
}
</style></head><body><div id="family-root"><p class="status">Carregando portal…</p></div><script src="/bolt-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/family.js"></script><script src="/bolt-shell.js" defer></script></body></html>
