<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOLT • Acesso do cliente</title><style>body{margin:0;background:#0f172a;color:#fff;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(440px,85vw);padding:30px;background:#1e293b;border:1px solid #64748b;border-radius:22px}h1{margin-top:0}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;margin:8px 0;font:inherit}input{background:#0f172a;color:#fff;border:1px solid #64748b}button{background:#475569;color:#fff;border:0;font-weight:700;cursor:pointer}#msg{overflow-wrap:anywhere}</style></head><body><main><h1>BOLT <span id="brand"></span></h1><p>Acesso administrativo da organização</p><form id="login"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><p id="msg" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/bolt-config.js"></script><script src="/bolt-workspace.js"></script><script>
(()=>{'use strict';const q=new URLSearchParams(location.search),product=q.get('product'),slug=q.get('slug'),msg=document.getElementById('msg'),form=document.getElementById('login'),button=form.querySelector('button');
document.getElementById('brand').textContent=product==='church'?'CHURCH':product==='class'?'CLASS':'';
if(!['church','class'].includes(product)||!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug||'')){msg.textContent='Endereço inválido. Solicite o link individual da sua organização.';form.hidden=true;return}
form.onsubmit=async e=>{e.preventDefault();if(button.disabled)return;button.disabled=true;msg.textContent='Validando acesso e abrindo seu sistema…';try{const sb=window.BOLT_WORKSPACE.client();const auth=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(auth.error)throw Error('E-mail ou senha inválidos.');const r=await fetch('/api/commercial-workspace?product='+product+'&slug='+encodeURIComponent(slug),{headers:{authorization:'Bearer '+auth.data.session.access_token}});const result=await r.json().catch(()=>({}));if(!r.ok||!result.ok)throw Error(result.error||'Não foi possível verificar o acesso.');document.getElementById('password').value='';location.assign('/'+(product==='church'?'Boltchurch':'Boltclass')+'/index.html?slug='+encodeURIComponent(slug));}catch(err){msg.textContent=err.message||'Não foi possível conectar.';}finally{button.disabled=false}};
})();
</script></body></html>
